<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AGPN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .button {
            display: block;
            padding: 15px;
            background: #3b82f6;
            border-radius: 12px;
            text-align: center;
            margin-top: 10px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        h1 {
            margin-top: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 AGPN</h1>

    <div class="card">
        <h3>VPN доступ</h3>
        <p>Быстрое подключение и стабильная работа</p>
        <a class="button">Купить</a>
    </div>

    <div class="card">
        <h3>Мои подключения</h3>
        <p>Управление конфигами</p>
        <a class="button">Открыть</a>
    </div>

    <div class="card">
        <h3>Настройки</h3>
        <p>Устройства и параметры</p>
        <a class="button">Настроить</a>
    </div>
</div>

</body>
</html>
